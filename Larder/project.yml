# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# Larder.xcodeproj is generated and git-ignored; edit this file instead.
name: Larder

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team ID here (or in Xcode) to run on a device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # The app target stays in Swift 5 language mode; InventoryCore uses Swift 6.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  InventoryCore:
    path: Packages/InventoryCore

targets:
  Larder:
    type: application
    platform: iOS
    sources:
      - path: Larder
    dependencies:
      - package: InventoryCore
        product: InventoryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.larder
        PRODUCT_NAME: Larder
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Larder
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Larder uses the camera to scan barcodes and receipts."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - LarderTests
      gatherCoverageData: true

  LarderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LarderTests
    dependencies:
      - target: Larder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.larder.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Larder.app/Larder"
        BUNDLE_LOADER: "$(TEST_HOST)"
