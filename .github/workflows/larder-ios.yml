name: Larder iOS

# Every push to main or a claude/** branch that changes the app runs the
# tests and, when they pass, uploads the build to TestFlight. Docs-only
# changes don't trigger a build; bump Larder/Config/testflight-build.txt to
# force one without a code change.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "Larder/**"
      - "!Larder/**/*.md"
      - ".github/workflows/larder-ios.yml"
  pull_request:
    paths:
      - "Larder/**"
      - "!Larder/**/*.md"
      - ".github/workflows/larder-ios.yml"
  workflow_dispatch:

# Pushes queue instead of cancelling each other, so an upload is never cut
# off halfway; if several pushes land during a run, only the newest waits.
concurrency:
  group: larder-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-linux:
    name: InventoryCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --package-path Larder/Packages/InventoryCore

  app-macos:
    name: App build and tests (iOS Simulator)
    runs-on: macos-26  # same Xcode as the TestFlight build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: InventoryCore tests (macOS)
        run: swift test --package-path Larder/Packages/InventoryCore

      - name: Install XcodeGen and xcbeautify
        if: ${{ !cancelled() }}
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        if: ${{ !cancelled() }}
        working-directory: Larder
        run: xcodegen generate

      - name: Pick an iPhone simulator
        if: ${{ !cancelled() }}
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, entries in devices.items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in entries:
                  if device["name"].startswith("iPhone") and (best is None or version > best[0]):
                      best = (version, device["udid"], device["name"])
          if best is None:
              sys.exit("no iPhone simulator available")
          print(best[1])
          print(f"Using {best[2]} (iOS {best[0][0]}.{best[0][1]})", file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test app
        if: ${{ !cancelled() }}
        working-directory: Larder
        run: |
          set -o pipefail
          xcodebuild test \
            -project Larder.xcodeproj \
            -scheme Larder \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Build and launch with run-simulator.sh
        if: ${{ !cancelled() }}
        run: Larder/scripts/run-simulator.sh --no-gui

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: Larder/TestResults.xcresult
          retention-days: 7

  testflight:
    name: Upload to TestFlight
    needs: [core-linux, app-macos]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
    # App Store Connect only accepts builds made with the iOS 26 SDK or later.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      # Always increases, and is already past every build the old standalone
      # TestFlight workflow uploaded (the last was 6).
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
          major="$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')"
          if [ "$major" -lt 26 ]; then
            echo "::error::App Store Connect requires Xcode 26 or later; this runner has Xcode $major."
            exit 1
          fi

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        working-directory: Larder
        run: xcodegen generate

      - name: Write API key
        # Normalizes common paste problems (Windows line endings, lost line
        # breaks, missing BEGIN/END lines, base64-wrapped .p8) and validates
        # the result. Only the fixes applied are printed, never the key.
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          python3 - "$RUNNER_TEMP/asc/AuthKey.p8" <<'PY'
          import base64, os, re, sys, textwrap
          raw = os.environ["ASC_KEY_P8"]
          fixes = []
          text = raw.strip().strip('"').strip("'")
          if "\r" in text:
              text = text.replace("\r", "")
              fixes.append("removed Windows line endings")
          if "BEGIN" not in text:
              try:
                  decoded = base64.b64decode(re.sub(r"\s+", "", text), validate=True).decode()
                  if "BEGIN" in decoded:
                      text = decoded.strip()
                      fixes.append("decoded a base64-wrapped .p8")
              except Exception:
                  pass
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", text)
          body = re.sub(r"\s+", "", body)
          if "BEGIN" not in text:
              fixes.append("added BEGIN/END lines")
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          if pem.strip() != text.strip():
              fixes.append("re-wrapped the key to standard PEM lines")
          with open(sys.argv[1], "w") as handle:
              handle.write(pem)
          os.chmod(sys.argv[1], 0o600)
          print("API key written" + (": " + ", ".join(dict.fromkeys(fixes)) if fixes else ""))
          PY
          if ! openssl pkey -in "$RUNNER_TEMP/asc/AuthKey.p8" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 isn't a valid private key. Paste the entire .p8 file contents, including the BEGIN and END lines."
            exit 1
          fi

      - name: Archive
        working-directory: Larder
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Larder.xcodeproj \
            -scheme Larder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Larder.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify --renderer github-actions

      - name: Sign and upload to App Store Connect
        working-directory: Larder
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Larder.xcarchive" \
            -exportOptionsPlist Config/ExportOptions-TestFlight.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions
          echo "Uploaded build $BUILD_NUMBER. It appears in TestFlight after Apple finishes processing (usually 10–30 minutes)."

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
