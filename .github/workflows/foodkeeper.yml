name: FoodKeeper data

# Downloads USDA FSIS FoodKeeper storage guidance (public domain) into
# .github/foodkeeper/raw/, where Larder/scripts/foodkeeper.py turns it into
# the app's bundled shelf-life data. Run it by hand to refresh the data.
on:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/foodkeeper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch FoodKeeper data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p .github/foodkeeper/raw
          ua="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15"
          got=""
          # USDA's servers refuse most cloud machines, so archived copies of
          # the same file are tried too.
          snapshot=$(curl -sS "https://archive.org/wayback/available?url=fsis.usda.gov/shared/data/EN/foodkeeper.json" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('archived_snapshots',{}).get('closest',{}).get('timestamp',''))" || true)
          echo "Closest archived snapshot: ${snapshot:-none}"
          for url in \
            "https://www.fsis.usda.gov/shared/data/EN/foodkeeper.json" \
            ${snapshot:+"https://web.archive.org/web/${snapshot}id_/https://www.fsis.usda.gov/shared/data/EN/foodkeeper.json"} \
            "https://web.archive.org/web/2025id_/https://www.fsis.usda.gov/shared/data/EN/foodkeeper.json" \
            "https://web.archive.org/web/2023id_/https://www.fsis.usda.gov/shared/data/EN/foodkeeper.json" \
            "https://www.fsis.usda.gov/shared/data/EN/FoodKeeper.json" \
            "https://www.foodsafety.gov/sites/default/files/foodkeeper.json"; do
            code=$(curl -sSL -A "$ua" -o /tmp/fk.json -w "%{http_code}" "$url" || echo "000")
            echo "$url -> HTTP $code, $(wc -c < /tmp/fk.json 2>/dev/null || echo 0) bytes"
            if [ "$code" = "200" ] && python3 -c "import json; d=json.load(open('/tmp/fk.json')); assert len(json.dumps(d)) > 10000"; then
              cp /tmp/fk.json .github/foodkeeper/raw/foodkeeper.json
              echo "$url" > .github/foodkeeper/raw/SOURCE
              got=json
              break
            fi
          done
          if [ -z "$got" ]; then
            for url in \
              "https://www.fsis.usda.gov/sites/default/files/media_file/documents/FoodKeeper-Data.xls" \
              "https://www.fsis.usda.gov/sites/default/files/media_file/2021-02/FoodKeeper-Data.xls"; do
              code=$(curl -sSL -A "$ua" -o /tmp/fk.xls -w "%{http_code}" "$url" || echo "000")
              echo "$url -> HTTP $code, $(wc -c < /tmp/fk.xls 2>/dev/null || echo 0) bytes"
              if [ "$code" = "200" ] && [ "$(wc -c < /tmp/fk.xls)" -gt 10000 ]; then
                pip install --quiet xlrd==2.0.1
                python3 - <<'EOF'
          import json, xlrd
          book = xlrd.open_workbook("/tmp/fk.xls")
          sheets = {}
          for sheet in book.sheets():
              rows = [sheet.row_values(i) for i in range(sheet.nrows)]
              sheets[sheet.name] = rows
          json.dump({"sheets": sheets}, open(".github/foodkeeper/raw/foodkeeper.json", "w"))
          EOF
                echo "$url" > .github/foodkeeper/raw/SOURCE
                got=xls
                break
              fi
            done
          fi
          if [ -z "$got" ]; then
            echo "::error::Couldn't download FoodKeeper data from any known address."
            exit 1
          fi
          python3 -c "import json; d=json.load(open('.github/foodkeeper/raw/foodkeeper.json')); print(type(d).__name__, list(d)[:10] if isinstance(d, dict) else len(d))"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/foodkeeper/raw
          if git diff --cached --quiet; then
            echo "Data unchanged."
          else
            git commit -m "Update USDA FoodKeeper data"
            git push
          fi
